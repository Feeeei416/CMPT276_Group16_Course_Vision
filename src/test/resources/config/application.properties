# Settings for tests only, read on top of src/main/resources/application.properties.
# Spring Boot reads config/application.properties after the one at the root of the classpath, so these win.
# (A file at src/test/resources/application.properties would replace the main one completely instead.)

# No automatic course refresh in tests: it would call the real SFU API and change the data partway through a run.
# CourseRefreshSchedulerTest calls the scheduler itself instead
app.course-refresh.automatic=false
