<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <title>Profile</title>
</head>
<body class="page">
    <header th:replace="~{fragments/header :: header}"></header>
    <main class="page-content">
        <h1 class="page-title">Profile</h1>

        <div class="notice-message" th:if="${message}" th:text="${message}" role="status">Your profile was saved.</div>
        <div class="error-message" th:if="${!errors.isEmpty()}" role="alert">
            <div th:each="e : ${errors}" th:text="${e}"></div>
        </div>

        <form th:action="@{/profile}" method="post">
            <!-- Shown but not editable -->
            <div class="form-field">
                <span class="form-label">Email</span>
                <span th:text="${user.email}">student@example.com</span>
            </div>
            <div class="form-field">
                <span class="form-label">Role</span>
                <span th:text="${roleName}">Student</span>
            </div>

            <div class="form-field">
                <label for="displayName" class="form-label">Display Name</label>
                <input type="text" class="input" id="displayName" name="displayName" maxlength="255" th:value="${user.displayName}" required>
            </div>

            <!-- Only students have a program and entry year -->
            <th:block th:if="${studentProfile != null}">
                <div class="form-field">
                    <label for="program" class="form-label">Program</label>
                    <select name="program" id="program" class="input" required>
                        <option th:each="p : ${programs}"
                                th:value="${p.name()}"
                                th:text="${p.showName}"
                                th:selected="${studentProfile.program == p}"></option>
                    </select>
                </div>
                <div class="form-field">
                    <label for="cohortYear" class="form-label">Entry Year</label>
                    <select name="cohortYear" id="cohortYear" class="input" required>
                        <option th:each="y : ${cohortYears}"
                                th:value="${y}"
                                th:text="${y}"
                                th:selected="${studentProfile.cohortYear == y}"></option>
                    </select>
                </div>
            </th:block>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save</button>
                <a th:href="@{${homePath}}" class="link">Back to home</a>
            </div>
        </form>
    </main>
</body>
</html>
