<!DOCTYPE html>
<!-- #78: owner is missing when UploadErrorHandler shows the page, so it falls back to the student's own version -->
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:with="byAdvisor=${owner != null and owner.byAdvisor()},
               base=${owner != null ? owner.basePath() : '/student'},
               home=${owner != null ? owner.homePath() : '/student/home'}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <title>Upload transcript</title>
</head>
<body class="page">
    <header th:replace="~{fragments/header :: header}"></header>
    <main class="page-content">
        <h1 class="page-title" th:text="${byAdvisor ? 'Upload a transcript for ' + owner.name() : 'Upload your transcript'}">Upload your transcript</h1>
        <p th:unless="${byAdvisor}">Download your unofficial transcript PDF from goSFU, then upload it here.
            You'll see the courses we found before anything is saved.</p>
        <p th:if="${byAdvisor}"
           th:text="|${owner.name()} can download their unofficial transcript PDF from goSFU. Upload it here, and you'll see the courses found before anything is saved to their record.|">
            Jack can download their unofficial transcript PDF from goSFU.</p>

        <div th:if="${error}" th:text="${error}" class="error-message" role="alert">That file isn't a PDF.</div>

        <form th:action="@{${base} + '/transcript'}" method="post" enctype="multipart/form-data">
            <div class="form-field">
                <label class="form-label" for="file">Transcript PDF</label>
                <input type="file" id="file" name="file" accept="application/pdf,.pdf" required
                       th:data-max-bytes="${uploadLimit.bytes}"
                       th:data-too-large="${uploadLimit.message}">
            </div>
            <div class="actions">
                <button type="submit" class="btn btn-primary">Upload</button>
                <a th:href="@{${home}}" class="link">Cancel</a>
            </div>
        </form>
    </main>

    <!-- Stops a file that is too large before it's sent, the server still checks it too -->
    <script>
        const fileInput = document.getElementById("file");
        fileInput.addEventListener("change", () => {
            const file = fileInput.files[0];
            const tooLarge = file && file.size > Number(fileInput.dataset.maxBytes);
            fileInput.setCustomValidity(tooLarge ? fileInput.dataset.tooLarge : "");
            fileInput.reportValidity();
        });
    </script>
</body>
</html>
