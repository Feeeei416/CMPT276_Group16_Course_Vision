<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <title>Edit course</title>
</head>
<body class="page">
    <header th:replace="~{fragments/header :: header}"></header>
    <main class="page-content">
        <h1 class="page-title">Edit course</h1>
        <p th:unless="${owner.byAdvisor()}">Your changes are kept when you upload a new transcript.</p>
        <p class="muted" th:if="${owner.byAdvisor()}"
           th:text="|Editing a course for ${owner.name()} (${owner.student().user.email}). Changes are kept when a new transcript is uploaded, and they see them on My courses.|">
            Editing a course for Jack.</p>

        <form th:action="@{${owner.basePath()} + '/courses/{id}/edit'(id=${courseId})}" method="post">
            <th:block th:replace="~{fragments/course-form :: courseFields}"></th:block>
            <div class="actions">
                <button type="submit" class="btn btn-primary">Save</button>
                <a th:href="@{${owner.basePath()} + '/courses'}" class="link">Cancel</a>
            </div>
        </form>
    </main>
    <script th:src="@{/js/course-search.js}" defer></script>
</body>
</html>
