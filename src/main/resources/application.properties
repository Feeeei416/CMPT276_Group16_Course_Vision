spring.application.name=group16

spring.jpa.hibernate.ddl-auto=update

spring.session.jdbc.initialize-schema=always
# Largest transcript PDF a student can upload
spring.servlet.multipart.max-file-size=1MB
# Tomcat drops the connection on uploads more than 2 MB over the limit, so the browser never sees the
# "file too large" page. It reads and throws away bigger uploads up to this size instead
server.tomcat.max-swallow-size=20MB

# Password for the demo accounts; leave DEMO_PASSWORD unset to skip them
app.demo-password=${DEMO_PASSWORD:}
