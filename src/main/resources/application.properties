spring.application.name=group16

spring.datasource.url=${Group16_DB_URL}
spring.datasource.username=${Group16_DB_USER}
spring.datasource.password=${Group16_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.session.jdbc.initialize-schema=always

# Password for the demo accounts; leave DEMO_PASSWORD unset to skip them
app.demo-password=${DEMO_PASSWORD:}
