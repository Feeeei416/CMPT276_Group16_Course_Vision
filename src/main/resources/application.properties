spring.application.name=group16

spring.jpa.hibernate.ddl-auto=update

spring.session.jdbc.initialize-schema=always
# Largest transcript PDF a student can upload
spring.servlet.multipart.max-file-size=1MB
# Tomcat drops the connection on uploads more than 2 MB over the limit, so the browser never sees the
# "file too large" page. It reads and throws away bigger uploads up to this size instead
server.tomcat.max-swallow-size=20MB

# Password for the demo accounts; leave DEMO_PASSWORD unset to skip them
app.demo-password=${DEMO_PASSWORD:}

# SFU Course Outlines API, used only by the course import
app.sfu-api.base-url=https://www.sfu.ca/bin/wcm/course-outlines
app.sfu-api.connect-timeout=5s
app.sfu-api.read-timeout=20s

# Automatic course refresh (CourseRefreshScheduler). The app checks the refresh log this often, and starts a refresh
# of next semester or this term when its last one finished longer ago than the time given for it.
# Checks only happen while the app is running, so on Render they only happen while the site is being used
app.course-refresh.automatic=true
app.course-refresh.first-check-after=2m
app.course-refresh.check-every=15m
app.course-refresh.next-semester-every=1d
app.course-refresh.current-term-every=7d
